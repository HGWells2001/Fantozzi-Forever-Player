plugins { id 'com.android.application' }
android {
 namespace 'it.fantozziforever.player'
 compileSdk 36
 defaultConfig {
  applicationId 'it.fantozziforever.player'
  minSdk 26
  targetSdk 35
  versionCode 8
  versionName '0.5.0'
 }
 signingConfigs {
  permanente {
   if (System.getenv("FF_KEYSTORE_FILE")) {
    storeFile file(System.getenv("FF_KEYSTORE_FILE"))
    storePassword System.getenv("FF_KEYSTORE_PASSWORD")
    keyAlias System.getenv("FF_KEY_ALIAS")
    keyPassword System.getenv("FF_KEY_PASSWORD")
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled false
   if (System.getenv("FF_KEYSTORE_FILE")) signingConfig signingConfigs.permanente
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.core:core:1.16.0'
 implementation 'androidx.media3:media3-exoplayer:1.11.1'
 implementation 'androidx.media3:media3-session:1.11.1'
}
