name: Compila e pubblica APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  compila:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configura SDK Android
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Compila APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepara APK per il download diretto
        run: cp app/build/outputs/apk/debug/app-debug.apk FantozziForever_v0.2.1_debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FantozziForever-debug
          path: FantozziForever_v0.2.1_debug.apk
          if-no-files-found: error
      - name: Pubblica Release scaricabile senza accesso
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.1 FantozziForever_v0.2.1_debug.apk --target "$GITHUB_SHA" --title "Fantozzi Forever 0.2.1" --notes "Prima versione di prova in italiano. APK di debug, non firmato con una chiave di distribuzione permanente. Il lettore utilizza il sito ufficiale tramite WebView." --prerelease --verify-tag=false
