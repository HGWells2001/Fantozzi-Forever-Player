name: Compila e pubblica APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: distribuzione-android
  cancel-in-progress: false
jobs:
  compila:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configura SDK Android
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Esegui test versioni
        run: |
          mkdir -p build/tests
          javac -d build/tests app/src/main/java/it/fantozziforever/player/ReleaseVersion.java tools/tests/ReleaseVersionTest.java
          java -cp build/tests ReleaseVersionTest
      - name: Leggi versione applicazione
        shell: bash
        run: |
          VERSION=$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'/\1/p" app/build.gradle)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Prepara eventuale firma permanente
        id: firma
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FF_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FF_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FF_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FF_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" && -z "$STORE_PASSWORD" && -z "$KEY_ALIAS" && -z "$KEY_PASSWORD" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Firma permanente non configurata. APK di prova."
          elif [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fantozzi-firma.jks"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Secrets di firma incompleti" >&2
            exit 1
          fi
      - name: Compila APK firmato per aggiornamenti
        if: steps.firma.outputs.enabled == 'true'
        env:
          FF_KEYSTORE_FILE: ${{ runner.temp }}/fantozzi-firma.jks
          FF_KEYSTORE_PASSWORD: ${{ secrets.FF_STORE_PASSWORD }}
          FF_KEY_ALIAS: ${{ secrets.FF_KEY_ALIAS }}
          FF_KEY_PASSWORD: ${{ secrets.FF_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Compila APK di prova
        if: steps.firma.outputs.enabled != 'true'
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepara APK
        shell: bash
        run: |
          if [[ "${{ steps.firma.outputs.enabled }}" == "true" ]]; then
            cp app/build/outputs/apk/release/app-release.apk "FantozziForever_v${VERSION}_release.apk"
            echo "APK=FantozziForever_v${VERSION}_release.apk" >> "$GITHUB_ENV"
            echo "TIPO=firmato con certificato permanente" >> "$GITHUB_ENV"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "FantozziForever_v${VERSION}_debug.apk"
            echo "APK=FantozziForever_v${VERSION}_debug.apk" >> "$GITHUB_ENV"
            echo "TIPO=di debug; potrebbe non aggiornare versioni precedenti" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FantozziForever-APK
          path: FantozziForever_v*.apk
          if-no-files-found: error
      - name: Controlla sintassi dello script PowerShell
        shell: pwsh
        run: |
          $token = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "tools/Configura-Firma-Permanente.ps1",
            [ref]$token, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
      - name: Pubblica GitHub Release (senza sovrascrivere tag esistenti)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "La Release v${VERSION} esiste gia: la lascio invariata."
          else
            gh release create "v${VERSION}" "$APK" --target "$GITHUB_SHA" \
              --title "Fantozzi Forever ${VERSION}" \
              --notes "APK ${TIPO}. Aggiornamenti dall'app con verifica SHA-256, versione, package e firma Android." \
              --prerelease
          fi
